<!--
  The newsletter's post block: the HTML inside the loop of the Brevo template
  (scripts/build-email-template.mjs wraps it into email/brevo-template.yaml).
  {{ item.X }} placeholders are filled from the feed item: ROOMS_DATE,
  ROOMS_BUTTONS and ROOMS_BODY come from the rooms:date, rooms:buttons and
  rooms:body tags that scripts/build-feed.mjs writes. The SOCIALS marker
  comment near the end is replaced with email/socials.html's table when the
  template is built. (Never write a comment's closing characters inside this
  one: they would end it early and the rest would show in the email.)

  Layout: 552px of content. On desktop the artwork sits on the right and the
  buttons on the left; the row is dir="rtl" so that on a phone, where the two
  columns wrap, the artwork comes first, as on the site. The buttons' width
  calc() is 0 or less at 552px and up (so min-width: 320px applies) and huge
  below it (so max-width: 100% applies): full width once stacked on a phone.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:14px 14px 0 14px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 5px;">
        <tr>
          <td width="22" valign="middle" style="width:22px;line-height:0;font-size:0;"><a href="https://thisisrooms.com/?utm_source=newsletter"><img src="https://thisisrooms.com/images/email/avatar-circle.png" width="22" height="22" alt="rooms" style="display:block;width:22px;height:22px;border:0;border-radius:50%;" /></a></td>
          <td valign="middle" style="padding-left:7px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px;line-height:1.4;color:#6b6c69;">an update from <a href="https://thisisrooms.com/?utm_source=newsletter" style="color:#6b6c69;text-decoration:underline;">rooms</a></td>
        </tr>
      </table>
      <h1 style="margin:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:28px;line-height:1.2;font-weight:bold;color:#0E100D;"><a href="{{ item.LINK }}?utm_source=newsletter" style="color:#0E100D;text-decoration:none;">{{ item.TITLE }}</a></h1>
      <p style="margin:6px 0 24px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;line-height:1.4;color:#6b6c69;"><a href="{{ item.LINK }}?utm_source=newsletter" style="color:#6b6c69;text-decoration:none;">{{ item.ROOMS_DATE }}</a></p>

      <div dir="rtl" style="font-size:0;line-height:0;text-align:center;">
        <!--[if mso]><table role="presentation" width="552" cellpadding="0" cellspacing="0" border="0" dir="rtl"><tr><td width="232" valign="top" dir="ltr"><![endif]-->
        <div dir="ltr" style="display:inline-block;width:100%;max-width:232px;vertical-align:top;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="padding:0 0 16px 16px;">
                <img src="{{ item.ENCLOSURE }}" width="216" alt="{{ item.TITLE }} artwork" style="display:block;box-sizing:border-box;width:100%;max-width:216px;height:auto;border:1px solid #d9d9d5;border-radius:8px;" />
              </td>
            </tr>
          </table>
        </div>
        <!--[if mso]></td><td width="320" valign="top" dir="ltr"><![endif]-->
        <div dir="ltr" style="display:inline-block;min-width:320px;max-width:100%;width:calc((552px - 100%) * 552);vertical-align:top;text-align:left;">
          {{ item.ROOMS_BUTTONS | safe }}
        </div>
        <!--[if mso]></td></tr></table><![endif]-->
      </div>

      <div style="padding-top:24px;">
        {{ item.ROOMS_BODY | safe }}
      </div>

      <p style="margin:0;padding-top:20px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;line-height:1.4;">
        <a href="{{ item.LINK }}?utm_source=newsletter" style="color:#6b6c69;text-decoration:none;">view on thisisrooms.com &rarr;</a>
      </p>

      <div style="margin:14px 0 0;">
        <!-- SOCIALS -->
      </div>
    </td>
  </tr>
</table>
